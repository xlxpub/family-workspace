# fail2ban 过滤器：识别 Caddy JSON 访问日志里失败的登录尝试。
#
# 为什么需要它：
#   应用自身有「失败 5 次锁 15 分钟」（auth_store.go），能挡住暴力破解，
#   但攻击者可以故意用错密码持续触发锁定，把你锁在门外。
#   这里按来源 IP 计数，连续刷 401 的 IP 直接封掉，避免锁定被滥用。
#
# 安装：
#   sudo cp deploy/fail2ban/filter.d/caddy-family.conf /etc/fail2ban/filter.d/
#   sudo cp deploy/fail2ban/jail.d/caddy-family.local /etc/fail2ban/jail.d/
#   sudo fail2ban-client reload
#
# 依赖 Caddyfile 中的配置：
#   log { output file /var/log/caddy/family.log; format json }
#
# 日志行样例（字段顺序由 Caddy 决定，这里只锚定 remote_ip、uri、status）：
#   {"level":"info","logger":"http.log.access",...,"request":{"remote_ip":"1.2.3.4",...,"uri":"/api/v1/auth/login",...},"status":401,...}

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*"uri":"/api/v1/auth/login".*"status":401.*$

ignoreregex =
