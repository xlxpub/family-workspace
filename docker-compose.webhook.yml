name: family-webhook

services:
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    image: family-webhook:latest
    container_name: family-webhook
    restart: unless-stopped
    # 直接占用宿主机 127.0.0.1:8091。独立项目名确保 make up 重建应用时不会停止本服务。
    network_mode: host
    working_dir: ${FW_WEBHOOK_DIR:?请使用 make webhook-up 启动}
    env_file:
      - deploy/github-webhook.env
    environment:
      FW_WEBHOOK_DIR: ${FW_WEBHOOK_DIR:?请使用 make webhook-up 启动}
      FW_WEBHOOK_ADDR: 127.0.0.1:8091
      GIT_TERMINAL_PROMPT: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 容器内外使用同一绝对路径，宿主机 Docker 才能读取构建目录。
      - ${FW_WEBHOOK_DIR:?请使用 make webhook-up 启动}:${FW_WEBHOOK_DIR:?请使用 make webhook-up 启动}
      - ${FW_WEBHOOK_SSH_DIR:-${HOME}/.ssh}:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8091/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
